[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wear-cnn"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "h5py>=3.9",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.1",
  "PyYAML>=6.0",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.17"]
train = ["torch>=2.2"]
gui = ["PyQt6>=6.9"]

[project.scripts]
wear-cnn = "wear_cnn.cli:main"
wear-cnn-gui = "wear_cnn.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
include = ["src/**/*.py", "tests/**/*.py", "tools/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

