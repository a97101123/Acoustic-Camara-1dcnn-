  strategy: fixed_knife
  test_knife: 9
  val_knives:
  - 7
  - 8
  prediction_rule: argmax
  batch_size: 256
  inference_batch_size: 32
  inference:
    start_seconds: 0.0
    duration_seconds: null
selection:
  methods:
  - r2
  j:
    acc_axis_quota: &id001
      x: 4
      y: 4
      z: 3
    mic_domain_quota: &id002
      mic_frequency: 7
      mic_time: 4
    require_equal_sensor_totals: true
  r2:
