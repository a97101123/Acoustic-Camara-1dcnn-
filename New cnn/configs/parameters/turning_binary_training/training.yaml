training:
  seed_start: 42
  runs: 3
  epochs: 100
  batch_size: 64
  validation_batch_size: 64
  checkpoint_every: 5
  severe_class_index: 1
  learning_rate: 0.001
  preload_device: false
  optimizer:
    name: adam
    betas:
    - 0.9
    - 0.999
    epsilon: 1.0e-08
    weight_decay: 0.0
    amsgrad: false
device: auto
cpu_threads: 4
cache_features: false
